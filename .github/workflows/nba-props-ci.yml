name: NBA Props CI

on:
  push:
    branches: [main, "claude/*"]
    paths:
      - "src/nba_props/**"
      - "sql/**"
      - "tests/nba_props/**"
      - "requirements-nba.txt"
  pull_request:
    branches: [main]
    paths:
      - "src/nba_props/**"
      - "sql/**"
      - "tests/nba_props/**"
      - "requirements-nba.txt"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nba_props_test
          POSTGRES_USER: nba_props
          POSTGRES_PASSWORD: nba_props
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-nba.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://nba_props:nba_props@localhost:5432/nba_props_test
        run: |
          for f in sql/migrations/*.sql; do
            PGPASSWORD=nba_props psql -h localhost -U nba_props -d nba_props_test -f "$f"
          done

      - name: Run tests
        env:
          DATABASE_URL: postgresql://nba_props:nba_props@localhost:5432/nba_props_test
          PYTHONPATH: src
        run: |
          pytest tests/nba_props/ -v --tb=short --cov=nba_props --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/nba_props/
